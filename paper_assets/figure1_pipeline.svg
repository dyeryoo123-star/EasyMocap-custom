<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 20px; fill: #536071; }
      .box-title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #14213d; }
      .box-text { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #4b5563; }
      .tag { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #4b5563; }
      .caption { font-family: Helvetica, Arial, sans-serif; font-size: 18px; fill: #374151; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .accent1 { fill: #246a73; }
      .accent2 { fill: #3a6ea5; }
      .accent3 { fill: #7a5c2e; }
      .accent4 { fill: #8a4f7d; }
      .accent5 { fill: #b24c39; }
      .accent6 { fill: #5f6f52; }
      .accent7 { fill: #243b53; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1800" height="760" fill="#f8fafc"/>

  <text x="90" y="72" class="title">Figure 1. Multi-Camera 3D Human Pose Estimation Pipeline</text>
  <text x="90" y="108" class="subtitle">Current system-development stage for robust 3D human pose estimation in limb-deficiency studies</text>

  <!-- Main process boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="210" height="150" class="box"/>
    <rect x="80" y="190" width="210" height="34" class="accent1" rx="8"/>
    <text x="104" y="213" class="tag">Stage 1</text>
    <text x="105" y="258" class="box-title">Data Acquisition</text>
    <text x="105" y="288" class="box-text">8-camera RGB setup</text>
    <text x="105" y="314" class="box-text">motion + calibration data</text>

    <rect x="330" y="190" width="210" height="150" class="box"/>
    <rect x="330" y="190" width="210" height="34" class="accent2" rx="8"/>
    <text x="354" y="213" class="tag">Stage 2</text>
    <text x="355" y="258" class="box-title">Video Processing</text>
    <text x="355" y="288" class="box-text">frame extraction</text>
    <text x="355" y="314" class="box-text">standard folder layout</text>

    <rect x="580" y="190" width="210" height="150" class="box"/>
    <rect x="580" y="190" width="210" height="34" class="accent3" rx="8"/>
    <text x="604" y="213" class="tag">Stage 3</text>
    <text x="605" y="258" class="box-title">2D Keypoints</text>
    <text x="605" y="288" class="box-text">bbox + body keypoints</text>
    <text x="605" y="314" class="box-text">confidence checking</text>

    <rect x="830" y="190" width="210" height="150" class="box"/>
    <rect x="830" y="190" width="210" height="34" class="accent4" rx="8"/>
    <text x="854" y="213" class="tag">Stage 4</text>
    <text x="855" y="258" class="box-title">Calibration</text>
    <text x="855" y="288" class="box-text">intrinsic parameters</text>
    <text x="855" y="314" class="box-text">extrinsic parameters</text>

    <rect x="1080" y="190" width="210" height="150" class="box"/>
    <rect x="1080" y="190" width="210" height="34" class="accent5" rx="8"/>
    <text x="1104" y="213" class="tag">Stage 5</text>
    <text x="1105" y="258" class="box-title">Synchronization</text>
    <text x="1105" y="288" class="box-text">frame offset search</text>
    <text x="1105" y="314" class="box-text">aligned static subsets</text>

    <rect x="1330" y="190" width="210" height="150" class="box"/>
    <rect x="1330" y="190" width="210" height="34" class="accent6" rx="8"/>
    <text x="1354" y="213" class="tag">Stage 6</text>
    <text x="1355" y="258" class="box-title">3D Reconstruction</text>
    <text x="1355" y="288" class="box-text">multi-view triangulation</text>
    <text x="1355" y="314" class="box-text">reprojection validation</text>

    <rect x="1580" y="190" width="170" height="150" class="box"/>
    <rect x="1580" y="190" width="170" height="34" class="accent7" rx="8"/>
    <text x="1604" y="213" class="tag">Stage 7</text>
    <text x="1605" y="258" class="box-title">SMPL Output</text>
    <text x="1605" y="288" class="box-text">mesh fitting</text>
    <text x="1605" y="314" class="box-text">vertices export</text>
  </g>

  <!-- arrows -->
  <path d="M292 265 L328 265" class="arrow"/>
  <path d="M542 265 L578 265" class="arrow"/>
  <path d="M792 265 L828 265" class="arrow"/>
  <path d="M1042 265 L1078 265" class="arrow"/>
  <path d="M1292 265 L1328 265" class="arrow"/>
  <path d="M1542 265 L1578 265" class="arrow"/>

  <!-- validation loop -->
  <path d="M1435 360 C1435 470, 930 470, 930 360" class="dash"/>
  <path d="M930 360 L930 342" class="arrow"/>
  <text x="1015" y="455" class="caption">Iterative validation: reprojection error, visual overlay, and problematic camera refinement</text>

  <!-- output artifacts -->
  <g filter="url(#shadow)">
    <rect x="215" y="540" width="250" height="96" class="box"/>
    <text x="240" y="578" class="box-title">Input Data</text>
    <text x="240" y="608" class="small">images/ and annots/</text>

    <rect x="545" y="540" width="250" height="96" class="box"/>
    <text x="570" y="578" class="box-title">Camera Files</text>
    <text x="570" y="608" class="small">intri.yml and extri.yml</text>

    <rect x="875" y="540" width="250" height="96" class="box"/>
    <text x="900" y="578" class="box-title">Sync Table</text>
    <text x="900" y="608" class="small">per-camera frame offsets</text>

    <rect x="1205" y="540" width="250" height="96" class="box"/>
    <text x="1230" y="578" class="box-title">3D Results</text>
    <text x="1230" y="608" class="small">keypoints3d/ and repro/</text>

    <rect x="1535" y="540" width="210" height="96" class="box"/>
    <text x="1560" y="578" class="box-title">Mesh Results</text>
    <text x="1560" y="608" class="small">smpl/ and vertices/</text>
  </g>

  <path d="M340 540 L340 500 L185 500 L185 342" class="dash"/>
  <path d="M670 540 L670 500 L935 500 L935 342" class="dash"/>
  <path d="M1000 540 L1000 500 L1185 500 L1185 342" class="dash"/>
  <path d="M1330 540 L1330 500 L1435 500 L1435 342" class="dash"/>
  <path d="M1640 540 L1640 342" class="dash"/>

  <text x="90" y="710" class="caption">Note. The current paper reports the foundation stage of a larger limb-deficiency pose estimation project: building a stable multi-camera capture, calibration, synchronization, and 2D-to-3D reconstruction pipeline.</text>
</svg>
